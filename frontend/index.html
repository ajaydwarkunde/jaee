<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jaai — Premium hand-poured candles and home products from Pune, Maharashtra, India" />
    <meta name="theme-color" content="#E9868B" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <title>Jaai | Premium Candles & Home Decor</title>
    <script>
      (function() {
        var t = localStorage.getItem('jaai-theme');
        var m = document.querySelector('meta[name="theme-color"]');
        var mobile = window.matchMedia('(max-width: 767px)').matches;
        if (mobile && !t) {
          document.documentElement.classList.remove('dark');
          if (m) m.setAttribute('content', '#E9868B');
        } else if (t === 'dark') {
          document.documentElement.classList.add('dark');
          if (m) m.setAttribute('content', '#1A1216');
        } else {
          document.documentElement.classList.remove('dark');
          if (m) m.setAttribute('content', '#E9868B');
        }
      })();
    </script>
  </head>
  <body class="font-sans bg-cream text-charcoal antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

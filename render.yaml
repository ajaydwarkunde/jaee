# ============================================
# Render Blueprint Configuration
# ============================================
# Deploy with: render blueprint apply
#
# Frontend is deployed via Vercel (not Render).
# See DEPLOYMENT.md for the full environment setup.

services:
  # ==========================================
  # Production Backend API
  # ==========================================
  - type: web
    name: jaee-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    repo: https://github.com/ajaydwarkunde/jaee
    branch: main
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_SHEETS_SYNC_SECRET
        sync: false
      - key: RAZORPAY_TEST_MODE
        value: "false"
    buildFilter:
      paths:
        - backend/**

  # ==========================================
  # Staging Backend API
  # ==========================================
  - type: web
    name: jaee-backend-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    repo: https://github.com/ajaydwarkunde/jaee
    branch: develop
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_SHEETS_SYNC_SECRET
        sync: false
      - key: RAZORPAY_TEST_MODE
        value: "true"
    buildFilter:
      paths:
        - backend/**

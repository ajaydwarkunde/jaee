# ============================================
# Render Blueprint Configuration
# ============================================
# Deploy with: render blueprint apply

services:
  # Backend API
  - type: web
    name: jaee-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore  # Change to your preferred region
    plan: free  # or starter, standard, pro
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: jaee-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false  # Set manually in dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_TEST_MODE
        value: "false"
    buildFilter:
      paths:
        - backend/**

  # Frontend (Static Site)
  - type: web
    name: jaee-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jaee-backend.onrender.com/api
    buildFilter:
      paths:
        - frontend/**

databases:
  - name: jaee-db
    plan: free  # or starter for production
    databaseName: jaee
    user: jaee_user
    region: singapore

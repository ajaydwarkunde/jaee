spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdGluZy1vbmx5LW1ha2UtaXQtbG9uZw==
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000

  razorpay:
    key-id: rzp_test_placeholder
    key-secret: secret_test_placeholder
    webhook-secret: webhook_secret_test_placeholder
    callback-url: http://localhost:5173/order-success
    test-mode: true

  email:
    from: test@jaee.com
    from-name: Jaee Test
    enabled: false

  sms:
    enabled: false

  otp:
    length: 6
    expiration-minutes: 5
    max-attempts: 5
    cooldown-seconds: 60

  integrations:
    google-sheets:
      sync-secret: test-sheet-secret

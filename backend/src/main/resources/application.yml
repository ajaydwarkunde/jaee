spring:
  application:
    name: jaee-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jaee}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 32
        jdbc:
          batch_size: 0

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  flyway: 
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-and-random-at-least-32-chars}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}  # 1 hour (was 15 min)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:secret_placeholder}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret_placeholder}
    callback-url: ${RAZORPAY_CALLBACK_URL:http://localhost:5173/order-success}
    test-mode: ${RAZORPAY_TEST_MODE:true}  # Set to false when using real keys

  # Email providers:
  # - resend (default): requires RESEND_API_KEY
  # - brevo-smtp / smtp: requires EMAIL_SMTP_* credentials (smtp-relay.brevo.com)
  # Always use EMAIL_FROM on a verified sender/domain for production delivery.
  admin:
    order-notification-email: ${ADMIN_ORDER_NOTIFICATION_EMAIL:JAAISTORE1212@gmail.com}

  email:
    provider: ${EMAIL_PROVIDER:resend}
    from: ${EMAIL_FROM:onboarding@resend.dev}
    from-name: ${EMAIL_FROM_NAME:Jaai}
    enabled: ${EMAIL_ENABLED:true}
    api-key: ${RESEND_API_KEY:}
    smtp-host: ${EMAIL_SMTP_HOST:smtp-relay.brevo.com}
    smtp-port: ${EMAIL_SMTP_PORT:587}
    smtp-username: ${EMAIL_SMTP_USERNAME:}
    smtp-password: ${EMAIL_SMTP_PASSWORD:}
    smtp-starttls: ${EMAIL_SMTP_STARTTLS:true}
    smtp-ssl: ${EMAIL_SMTP_SSL:false}

  sms:
    provider: ${SMS_PROVIDER:twilio}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      phone-number: ${TWILIO_PHONE_NUMBER:}
    enabled: ${SMS_ENABLED:true}

  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    from-number: ${WHATSAPP_FROM_NUMBER:}  # Twilio WhatsApp-enabled number

  otp:
    length: 6
    expiration-minutes: 5
    max-attempts: 5
    cooldown-seconds: 60

  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    credentials: ${FIREBASE_CREDENTIALS:}  # Base64 encoded service account JSON

  integrations:
    google-sheets:
      sync-secret: ${GOOGLE_SHEETS_SYNC_SECRET:}

  # Fulfillment / warehouse (shipping tier “local” uses Pune metro cluster — see ShippingZoneResolver)
  shipping:
    origin-city: ${SHIPPING_ORIGIN_CITY:Wakad}
    origin-state: ${SHIPPING_ORIGIN_STATE:Maharashtra}

  supabase:
    url: ${SUPABASE_URL:}
    key: ${SUPABASE_SERVICE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:images}

  cache-warm:
    enabled: ${CACHE_WARM_ENABLED:true}
    delay-seconds: ${CACHE_WARM_DELAY_SECONDS:2}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false  # Disable mail health check (optional service)

# Logging
logging:
  level:
    root: INFO
    com.jaee: INFO
    com.jaee.config.RequestLoggingFilter: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: false

logging:
  level:
    com.jaee: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.jaee: INFO
    com.jaee.config.RequestLoggingFilter: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level - %msg%n"

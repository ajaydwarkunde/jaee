plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.graalvm.buildtools.native' version '0.10.4'
}

group = 'com.jaee'
version = '1.0.0'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Spring uses spring-jcl; transitive commons-logging breaks native-image (LogFactory init at build time).
configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

ext {
    jjwtVersion = '0.12.3'
    razorpayVersion = '1.4.6'
    sendgridVersion = '4.10.1'
    twilioVersion = '9.14.1'
    firebaseAdminVersion = '9.2.0'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Razorpay
    implementation "com.razorpay:razorpay-java:${razorpayVersion}"

    // SendGrid
    implementation "com.sendgrid:sendgrid-java:${sendgridVersion}"

    // Twilio
    implementation "com.twilio.sdk:twilio:${twilioVersion}"

    // Firebase Admin SDK
    implementation "com.google.firebase:firebase-admin:${firebaseAdminVersion}"

    // Supabase Storage (using REST API via OkHttp)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Dev Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Enable layered JAR for optimal Docker caching
tasks.named('bootJar') {
    layered {
        enabled = true
    }
}

bootRun {
    systemProperty 'spring.profiles.active', 'dev'
}

// GraalVM Native Image — run: ./gradlew nativeCompile (requires GraalVM JDK or NIK in PATH)
// Smaller runtime than JRE+JAR; see Dockerfile.native for distroless-style deploy.
graalvmNative {
    binaries {
        main {
            imageName = 'jaee-backend'
            buildArgs.add('-H:+ReportExceptionStackTraces')
            buildArgs.add('--initialize-at-run-time=org.apache.commons.logging')
        }
    }
    metadataRepository {
        enabled = true
    }
}

name = "jaee-backend"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[observability]
enabled = true

# ── Container Configuration ──────────────────────────────────────────
# Uses the existing Spring Boot Dockerfile from backend/
[[containers]]
class_name = "JaeeBackend"
image = "../../backend/Dockerfile"
instance_type = "standard-1"   # 1/2 vCPU, 4 GiB RAM, 8 GB disk
max_instances = 3

[[durable_objects.bindings]]
name = "JAEE_BACKEND"
class_name = "JaeeBackend"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JaeeBackend"]

# ── Environment Variables (non-secret) ───────────────────────────────
[vars]
SPRING_PROFILES_ACTIVE = "prod"
CORS_ALLOWED_ORIGINS = "https://jaee.pages.dev"
EMAIL_FROM = "onboarding@resend.dev"
EMAIL_FROM_NAME = "Jaai"
SUPABASE_STORAGE_BUCKET = "images"

# ── Secrets (set via `wrangler secret put <KEY>`) ────────────────────
# DATABASE_URL
# DATABASE_USERNAME
# DATABASE_PASSWORD
# JWT_SECRET
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET
# RAZORPAY_WEBHOOK_SECRET
# RESEND_API_KEY
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN
# TWILIO_PHONE_NUMBER
# SUPABASE_URL
# SUPABASE_SERVICE_KEY
# FIREBASE_CREDENTIALS

name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Backend
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "${{ secrets.BACKEND_URL }}/actuator/health" \
            -o /dev/null -w "Production Backend: %{http_code}\n" || true

      - name: Ping Staging Backend
        run: |
          if [ -n "${{ secrets.STAGING_BACKEND_URL }}" ]; then
            curl -fsS --retry 3 --retry-delay 5 \
              "${{ secrets.STAGING_BACKEND_URL }}/actuator/health" \
              -o /dev/null -w "Staging Backend: %{http_code}\n" || true
          fi

      - name: Ping Frontend
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "${{ secrets.FRONTEND_URL }}" \
            -o /dev/null -w "Frontend: %{http_code}\n" || true

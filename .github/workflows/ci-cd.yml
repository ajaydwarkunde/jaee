name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # Backend: Build and Test
  # ============================================
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build
        run: ./gradlew build -x test --no-daemon
      
      - name: Run tests
        run: ./gradlew test --no-daemon

  # ============================================
  # Frontend: Build and Test
  # ============================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npx vitest run
        continue-on-error: true

      - name: Type check and build
        run: npm run build

  # ============================================
  # Deploy Production (main branch only)
  # ============================================
  deploy-production:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Deploy Backend to Production
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
            echo "Production backend deploy triggered"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK not set - skipping"
          fi

      - name: Deployment summary
        run: |
          echo "Production deployment triggered!"
          echo "Backend: Render production service"
          echo "Frontend: Vercel handles production deploy automatically on main push"

  # ============================================
  # Deploy Staging (develop branch only)
  # ============================================
  deploy-staging:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - name: Deploy Backend to Staging
        run: |
          if [ -n "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}"
            echo "Staging backend deploy triggered"
          else
            echo "RENDER_STAGING_DEPLOY_HOOK not set - skipping"
          fi

      - name: Deployment summary
        run: |
          echo "Staging deployment triggered!"
          echo "Backend: Render staging service"
          echo "Frontend: Vercel creates preview deployment automatically"

  # ============================================
  # Auto-promote: staging -> production
  # After staging deploys, health-check it and
  # auto-merge develop into main if healthy.
  # ============================================
  promote-to-production:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Wait for Render to deploy
        run: |
          echo "Waiting 2 minutes for Render to build and start the staging service..."
          sleep 120

      - name: Health check staging backend
        run: |
          MAX_ATTEMPTS=10
          WAIT_SECONDS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "${{ secrets.STAGING_BACKEND_URL }}/actuator/health") || true
            if [ "$status" = "200" ]; then
              echo "Staging is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $status — retrying in ${WAIT_SECONDS}s..."
            sleep $WAIT_SECONDS
          done
          echo "Staging health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge develop into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout main
          git merge origin/develop --no-edit -m "Auto-promote: develop to main [staging healthy]"
          git push origin main

      - name: Deploy Backend to Production
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
            echo "Production backend deploy triggered"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK not set - skipping"
          fi
